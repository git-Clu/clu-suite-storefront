# Copy into this repo as deploy/app.conf. Read by `clu-app ship` on the server as plain KEY=VALUE
# text — it is never executed. Everything it creates is created once; re-shipping never overwrites.
NAME=clu-portal
DOMAIN=portal.clu.gr
PORT=4330
HEALTH=/api/health
ENTRY=dist/server/entry.mjs
# Migrations run here, before the release is switched live and health-checked.
BUILD=npm ci && npm run migrate && npm run build
ENV_FILE=deploy/app.env
# This service must never reset like the demo apps: licences and sessions are not demo state.
# RUNTIME_MAX is deliberately absent.
POSTGRES=yes
